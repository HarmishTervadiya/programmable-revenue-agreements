[package]
name = "programmable-revenue-agreement"
version = "0.1.0"
description = "Programmable Revenue Agreements"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "programmable_revenue_agreement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", features = ["token_2022", "token_2022_extensions"] }
spl-tlv-account-resolution = "0.11"
spl-transfer-hook-interface = "2.1"

[dev-dependencies]
litesvm = "0.16.0"
solana-keypair = "3.1.2"
solana-message = "4"
solana-signer = "3.0.1"
solana-transaction = "4.1.4"
solana-account = "4"
solana-system-interface = "3.2"
solana-compute-budget-interface = "3"
pra = { package = "spl-token-2022-interface", version = "3.1" }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
